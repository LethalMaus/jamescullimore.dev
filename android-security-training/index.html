<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Android Security Training Landing Page Review</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f9fb;
      --surface: #ffffff;
      --text: #10202f;
      --muted: #5b6a78;
      --border: #d8e2e8;
      --accent: #075563;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    main {
      width: min(100%, 760px);
      padding: 32px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 22px 70px rgba(31, 54, 72, 0.12);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 6vw, 3.2rem);
      line-height: 1;
    }

    p {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 1.05rem;
    }

    ul {
      display: grid;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 18px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--accent);
      font-weight: 750;
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      border-color: #a9cfd7;
      background: #f6fbfc;
      outline: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Android Security Training Landing Page</h1>
    <p>Review launcher for the static landing page variants.</p>
    <ul>
      <li><a href="android-security-training.html">Dark version <span>Open</span></a></li>
      <li><a href="android-security-training-light.html">Light version <span>Open</span></a></li>
    </ul>
  </main>
</body>
</html>
