<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>ScrumScore · Play together</title>
<style>
body{margin:0;background:#f8f7f2;color:#163e30;font:18px/1.6 system-ui}main{max-width:560px;margin:8vh auto;padding:32px}h1{font-size:clamp(2rem,8vw,3.5rem);line-height:1.1}code{display:block;padding:24px;background:#17624b;color:white;border-radius:16px;font-size:1.5rem;overflow-wrap:anywhere}a,button{display:inline-block;padding:14px 20px;margin:8px 4px 8px 0;border:2px solid #17624b;border-radius:28px;color:#163e30;font:inherit}a:focus-visible,button:focus-visible{outline:3px solid #8b4b00;outline-offset:4px}[hidden]{display:none}
</style>
<main><p>ScrumScore</p><button id="language" type="button">Deutsch</button><h1 id="title">Rugby is better together.</h1><p id="body">Install ScrumScore, add a player, then join your private group with this code.</p><code id="code" hidden></code><p id="empty">Your group organizer can give you an invitation code.</p><a id="apple" hidden>App Store</a><a id="google" hidden>Google Play</a><p id="note">This invitation is for one player. Keep the code to enter after installing the app.</p></main>
<script>
const q=new URLSearchParams(location.search),code=q.get('code')||'';
if(/^[A-Fa-f0-9]{12}$/.test(code)){document.querySelector('#code').textContent=code.toUpperCase();document.querySelector('#code').hidden=false;document.querySelector('#empty').hidden=true;}
let de=navigator.language.toLowerCase().startsWith('de');
function render(){document.documentElement.lang=de?'de':'en';document.querySelector('#language').textContent=de?'English':'Deutsch';document.querySelector('#title').textContent=de?'Rugby macht zusammen mehr Spaß.':'Rugby is better together.';document.querySelector('#body').textContent=de?'Installiere ScrumScore, lege einen Spieler an und tritt deiner privaten Gruppe mit diesem Code bei.':'Install ScrumScore, add a player, then join your private group with this code.';document.querySelector('#empty').textContent=de?'Deine Gruppenleitung kann dir einen Einladungscode geben.':'Your group organizer can give you an invitation code.';document.querySelector('#note').textContent=de?'Diese Einladung gilt für eine Person. Bewahre den Code für die Eingabe nach der Installation auf.':'This invitation is for one player. Keep the code to enter after installing the app.';}
document.querySelector('#language').onclick=()=>{de=!de;render()};render();
fetch('/scrumscore/config.json').then(r=>r.json()).then(c=>{for(const [id,url,host] of [['apple',c.appStoreUrl,'apps.apple.com'],['google',c.playStoreUrl,'play.google.com']]){if(url){const u=new URL(url);if(u.protocol==='https:'&&u.hostname===host){const a=document.getElementById(id);a.href=u.href;a.hidden=false;}}}}).catch(()=>{});
</script>
</html>
